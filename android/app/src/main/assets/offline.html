<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>서재교회</title>
  <style>
    body{margin:0;font-family:sans-serif;background:#f7f8fa;color:#172033;display:grid;place-items:center;min-height:100vh;padding:24px;box-sizing:border-box}
    .box{max-width:420px;background:#fff;border:1px solid #e6e9ef;border-radius:18px;padding:28px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.06)}
    h1{font-size:24px;margin:0 0 10px}p{color:#6c7484;line-height:1.7}.btn{display:inline-block;margin-top:14px;padding:12px 18px;border-radius:10px;background:#204b72;color:#fff;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <div class="box">
    <h1>인터넷 연결을 확인해 주세요</h1>
    <p>서재교회 홈페이지에 연결할 수 없습니다.<br>인터넷 연결 후 다시 시도해 주세요.</p>
    <a class="btn" href="app://retry">다시 시도</a>
  </div>
</body>
</html>
