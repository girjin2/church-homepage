name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "android-apk" ]
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Collect APK
        working-directory: android
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/SeojaeChurch-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: seojae-church-apk
          path: android/dist/SeojaeChurch-debug.apk
          if-no-files-found: error
          retention-days: 30
